name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    name: Build Windows desktop app
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: desktop
        run: npm install --no-audit --no-fund

      - name: Build installers
        working-directory: desktop
        run: npx electron-builder --win --publish never

      - uses: actions/upload-artifact@v4
        with:
          name: windows-installers
          path: desktop/release/*.exe

  android:
    name: Build Android APKs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      # Without these secrets the build falls back to the debug key, which collides on
      # install with any copy signed by a different machine.
      - name: Decode release keystore
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/filigram-release.jks"

      - name: Build release APKs
        env:
          FILIGRAM_KEYSTORE_FILE: ${{ runner.temp }}/filigram-release.jks
          FILIGRAM_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          FILIGRAM_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          FILIGRAM_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Report signing certificate
        run: |
          BUILD_TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/* | tail -1)
          "$BUILD_TOOLS/apksigner" verify --print-certs app/build/outputs/apk/release/app-universal-release.apk | grep -E "certificate DN|SHA-256 digest"

      - name: Remove decoded keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/filigram-release.jks"

      - uses: actions/upload-artifact@v4
        with:
          name: android-apks
          path: app/build/outputs/apk/release/*.apk

  release:
    name: Publish GitHub release
    needs: [windows, android]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/windows-installers/*.exe
            artifacts/android-apks/*.apk
          generate_release_notes: true
